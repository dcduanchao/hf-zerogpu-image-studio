name: Deploy Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'gpu-space/**'
      - 'ui-space/**'
      - 'scripts/deploy_spaces.py'
      - '.github/workflows/deploy-spaces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-spaces-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
      GPU_SPACE_NAME: ${{ vars.GPU_SPACE_NAME || 'my-zerogpu-engine' }}
      UI_SPACE_NAME: ${{ vars.UI_SPACE_NAME || 'my-image-studio' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Publish both Gradio Spaces
        run: python scripts/deploy_spaces.py
      - name: Check Hugging Face Space build status
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_spaces.py
      - name: Smoke-test OpenAI API from GitHub runner
        run: python scripts/smoke_openai_routes.py
