name: Deploy Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'gpu-space/**'
      - 'ui-space/**'
      - 'scripts/deploy_spaces.py'
      - 'scripts/smoke_openai_routes.py'
      - 'scripts/test_admin_switch.py'
      - 'scripts/test_model_state.py'
      - 'scripts/test_token_quota.py'
      - '.github/workflows/deploy-spaces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-spaces-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
      GPU_SPACE_NAME: ${{ vars.GPU_SPACE_NAME || 'my-zerogpu-engine' }}
      UI_SPACE_NAME: ${{ vars.UI_SPACE_NAME || 'my-image-studio' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax before publishing
        run: python -m compileall -q gpu-space ui-space scripts
      - name: Install deployment client
        run: python -m pip install 'huggingface_hub>=2.1.1,<3' 'gradio_client>=1.13,<3'
      - name: Verify owner-only model switch permissions
        run: python scripts/test_admin_switch.py
      - name: Verify active model read-only status and routing
        run: python scripts/test_model_state.py
      - name: Verify visitor ZeroGPU quota display
        run: python scripts/test_token_quota.py
      - name: Publish GPU and UI Spaces
        run: python scripts/deploy_spaces.py
      - name: Check Hugging Face Space build status
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_spaces.py
      - name: Smoke-test OpenAI API from GitHub runner
        run: python scripts/smoke_openai_routes.py
