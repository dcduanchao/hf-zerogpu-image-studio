name: Diagnose Hugging Face UI Space
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Inspect UI Space state and recent build/run errors
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          import os
          api=HfApi(token=os.environ["HF_TOKEN"])
          repo="duan0320/my-image-studio"
          try:
              info=api.space_info(repo,expand=["runtime"])
              print("STAGE",getattr(getattr(info,"runtime",None),"stage",None),flush=True)
          except Exception as exc:
              print("STATUS",type(exc).__name__,flush=True)
          for is_build in (True,False):
              try:
                  lines=list(api.fetch_space_logs(repo_id=repo,build=is_build))
                  lines=[str(x).rstrip() for x in lines]
                  print("LOG TYPE","build" if is_build else "run","LINES",len(lines),flush=True)
                  for line in lines[-35:]:
                      if "hf_" in line:
                          print("(redacted log line)",flush=True)
                      else:
                          print(line[:900],flush=True)
              except Exception as exc:
                  print("LOG ERROR",is_build,type(exc).__name__,str(exc)[:120],flush=True)
          PY
