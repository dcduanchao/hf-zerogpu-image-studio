name: Probe MOSS Gradio API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-moss.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gradio_client>=1.13,<3' requests
      - name: Inspect MOSS API without generating images
        run: |
          python - <<'PY'
          import json, requests
          from gradio_client import Client
          base = "https://asrarkhann112-moss-image-nsfw-lora.hf.space"
          for route in ("/gradio_api/info", "/config"):
              try:
                  r = requests.get(base + route, timeout=25)
                  print("STATUS", route, r.status_code,flush=True)
                  if route.endswith("/info") and r.ok:
                      data = r.json()
                      print("NAMED ENDPOINTS", json.dumps(data.get("named_endpoints"), ensure_ascii=False, default=str)[:25000],flush=True)
                  elif route == "/config" and r.ok:
                      config=r.json()
                      print("COMPONENTS", json.dumps([{ "id": c.get("id"), "type": c.get("type"), "props": {k:v for k,v in c.get("props",{}).items() if k in ("label","value","choices","minimum","maximum")}} for c in config.get("components",[])],ensure_ascii=False,default=str)[:18000],flush=True)
              except Exception as exc:
                  print("PROBE ERROR", type(exc).__name__,str(exc)[:200],flush=True)
          for filename in ("README.md", "app.py", "requirements.txt", "pipeline_moss_image.py"):
              try:
                  url="https://huggingface.co/spaces/asrarkhann112/moss-image-nsfw-lora/raw/main/"+filename
                  r=requests.get(url,timeout=35)
                  print("SOURCE",filename,"status",r.status_code,"length",len(r.content),flush=True)
                  if r.ok:
                      print("BEGIN SOURCE",filename,flush=True)
                      print(r.text[:45000],flush=True)
                      print("END SOURCE",filename,flush=True)
              except Exception as exc:
                  print("SOURCE ERROR",filename,type(exc).__name__,flush=True)
          try:
              c=Client("asrarkhann112/moss-image-nsfw-lora", download_files=False)
              c.view_api()
          except Exception as exc:
              print("CLIENT ERROR",type(exc).__name__,str(exc)[:500],flush=True)
          PY
